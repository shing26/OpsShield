# 一期 CI：零凭据、零中间件即可跑——mvn 单测全 mock/H2-local；Python 侧 chunkers 不变量
# + 跨语言词法护栏 + 告警生产者判定/闸门（不触网，由 fixture 强制）；bash 侧面板契约
# 与全脚本语法检查（脚本是运维动作的入口，语法错到用的时候才发现太晚）；
# 以及"证据同代"的两个面：面一"报告↔语料"（摘要）+ 面二"文档数字↔产物"（现算），
# 外加干净检出下跑一次证据打包 smoke（O1 的验收从人工一次性变成每次复现）。
# live 依赖的 A2/A3 验收不进 CI（需 compose 栈），由本地验收脚本承担。
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit tests
        run: mvn -B test
      # B9（2026-09-22 补）：覆盖率棘轮。产物由上一步的 jacoco:report 产出（report 绑在
      # test 阶段，与本 job 跑 mvn test 的形状对齐）。加步骤不加 job——产物就在本 job 里，
      # 另起 job 要重跑一遍构建；这也是本仓既有的取舍（见 provenance job 的同类注释）。
      - name: Coverage ratchet (0-token)
        run: python3 scripts/check_coverage.py

  # G0（2026-10-22）：生产门禁静态档。把"备份龄/告警规则/绑定地址/审计上限/失败证据"
  # 这些审查发现的硬伤钉成每次 CI 都跑的判据——它们不是功能测试，是"运维面没接线"的回归锁。
  # 测试本身仍由 java/python job 跑；本 job 用 SKIP_TESTS=1 避免重复。
  # G1（2026-10-22）：真进程 smoke。单测全 mock 证明不了"打出来的 fat jar 能不能起、
  # Flyway 会不会在空库建表、SSE 与指标是否真的通"——这一层用 memory+mock 起 jar 跑最短链路。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build fat jar
        run: mvn -B -DskipTests package
      - name: Runtime smoke (memory/mock)
        run: bash scripts/smoke.sh

  # G1：依赖物料清单。不是漏洞扫描，但发布时"带了什么"必须可复核；
  # CycloneDX JSON 由 release 归档/下游 SCA 消费。
  # 真正的 SCA 在 security job（Trivy FS）；两者分工：SBOM 回答"有什么"，SCA 回答"有没有已知洞"。
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Generate CycloneDX SBOM
        run: bash scripts/sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json

  # G1 门禁 8：SCA。Trivy 扫依赖 lock/BOM 与文件系统里的已知 CVE；只拦高危/严重且已有修复的项。
  # 为什么不用 OWASP dependency-check：它依赖 NVD API key/长时下载，在 PR 上稳定性差；
  # Trivy 的漏洞库随 action 镜像更新，CI 可复现。SBOM 仍由 sbom job 产出。
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Production gate (static)
        run: SKIP_TESTS=1 bash scripts/production_gate.sh --fast

  panel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ops Console ↔ backend key contract (ADR-0009 / W11)
        run: bash scripts/check_panel_contract.sh

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 判据是内容摘要（非 mtime）：git checkout 会把所有 mtime 刷成检出时刻，
      # 时间戳判据在 CI 里恒真、等于门闩空转（见 offline/provenance.py 顶部）。
      - name: Report ⟷ corpus same-generation gate
        working-directory: offline
        run: python provenance.py --check
      # 面二：报告与语料同代 ≠ 文档里的数字是对的（人抄错/漏改，面一完全看不见）。
      # README 曾写「121 用例」而实际已是 131——同一缺陷类在面一上线后又发生了一次。
      - name: Doc numbers ⟷ artifacts gate
        working-directory: offline
        run: python doc_numbers.py --check
      # 对外面用词门闩（ADR-0023 决策 1–4）：canonical 词不得漏到 README + 页面文案。
      # 词表从 CONTEXT.md 的 `_对外_` 行**现取**（不手写），登记表空了即红；反向启发式只报不闸。
      - name: Public-surface wording gate (ADR-0023)
        run: python scripts/check_public_copy.py --check
      # 答案接地的机器侧（OP-R1，2026-09-28）：判据只断言「同代 + 零无据」——
      # 报告由 live 探针产出后入库，CI 只读入库产物；**不**断言接地率数值（live 读数含波动，
      # 纳入 doc_numbers 会让门闩假红）。这一项为什么值得进 CI：接地是防幻觉链路唯一的事后环，
      # 而它在 mock 后端上恒真（mock 答案是逐字复制 chunk 正文），故 live 之外只剩这份报告能守。
      - name: Grounding report ⟷ corpus same-generation + zero-ungrounded gate
        working-directory: offline
        run: python eval/answer_eval.py --check
      # 把 O1 的验收（"干净检出 + mock 一条命令产出完整归档"）从人工一次性变成每次 CI 复现：
      # 这里同时验证出包不因自检而误拒（分叉时打包器会拒绝出包，正是我们要的行为）。
      - name: Evidence pack smoke (clean checkout, mock)
        run: |
          out="$RUNNER_TEMP/evidence"
          python scripts/pack_evidence.py --out "$out"
          archive=$(ls -d "$out"/*/ | head -1)
          test -f "${archive}MANIFEST.md" || { echo "::error::缺 MANIFEST.md"; exit 1; }
          test -f "${archive}CHECKSUMS.sha256" || { echo "::error::缺 CHECKSUMS.sha256"; exit 1; }
          (cd "$archive" && sha256sum -c CHECKSUMS.sha256 > /dev/null) \
            || { echo "::error::sha256sum -c 失败：归档自身不自洽"; exit 1; }
          grep -q "同代自检：通过" "${archive}MANIFEST.md" \
            || { echo "::error::MANIFEST 未登记同代自检结论"; exit 1; }
          echo "OK: 证据快照自洽（$(wc -l < "${archive}CHECKSUMS.sha256") 项）"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dev deps
        run: pip install -r offline/requirements-dev.txt   # 版本锁定见该文件（不锁=pytest 大版本变更即打红）
      - name: Chunker invariants + lexicon guards
        working-directory: offline
        run: python -m pytest tests/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check (every script)
        run: |
          fail=0
          for f in scripts/*.sh; do
            if ! bash -n "$f"; then echo "::error file=$f::bash -n 失败"; fail=1; fi
          done
          [ "$fail" = "0" ] && echo "OK: $(ls scripts/*.sh | wc -l) 个脚本语法通过"
          exit $fail
