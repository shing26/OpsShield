server:
  port: ${SERVER_PORT:8081}   # 8080 被本机 nexus-web 占用，OpsPilot 用 8081
  # G0-W0.1（2026-10-22 运维审查）：默认只绑环回。此前用 Boot 默认（0.0.0.0），
  # 同网段任何人都能直达面板与 /v1 面——鉴权是 JWT，但它不是网络边界。
  # 容器（compose 端口映射）/反代形态由 SERVER_ADDRESS=0.0.0.0 显式放开。
  address: ${SERVER_ADDRESS:127.0.0.1}
  # 优雅停机：给在途 SSE 流与进行中的编排任务一个收敛窗口，重启不再直接切断客户端。
  shutdown: graceful
  tomcat:
    # 请求体上限的第二道（第一道是 RequestSizeLimitFilter：/api/** /v1/** 超 1MB 直接 413）。
    # 这里是"拒绝之后最多再吞多少就断开"，防止已拒绝的请求仍把大包读完。
    max-swallow-size: 1MB

spring:
  application:
    name: opspilot-gateway
  # 与 server.shutdown=graceful 配对：30s 内等在途请求收敛完再退出，超时才强杀。
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      # 面板是"部署形态"的一部分，不是可缓存的静态库：改完版重新部署后拿到旧 HTML，
      # 运维看到的仍是上一版布局，还会误以为改动没生效（2026-10-05 连续两次撞到）。
      # 无 Cache-Control 时浏览器靠 Last-Modified 启发式缓存，故显式关掉。
      # 代价≈0：本面板是单文件 HTML、零 CDN 零外部依赖（ADR-0009），没有可缓存的第二份产物。
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          must-revalidate: true
  # P2 账号体系主库：H2 文件模式；口令只从环境注入（H2_DB_PASSWORD），源码/示例零凭据字面量。
  # G0-W0.1：去掉 AUTO_SERVER=TRUE——它会在同目录额外开一个 TCP 服务（随机端口、
  # 仅凭文件路径即可连库），等于多一个"本机任意进程都能试口令"的入口。
  # CLI 维护请短暂停服后同文件访问（user_admin.sh 的 H2_DB_URL 可覆盖）。
  datasource:
    url: ${H2_DB_URL:jdbc:h2:file:./data/users}
    username: ${H2_DB_USER:opspilot}
    password: ${H2_DB_PASSWORD:}
  # G1（2026-10-22）：schema 由 Flyway 版本化，sql.init 关闭——两者都开会在空库上重复建表，
  # 且"哪个先跑"取决于自动装配顺序，是不可见的事实。空库由 V1 建表；已有库会幂等执行 V1
  # （DDL 是 CREATE TABLE IF NOT EXISTS，不丢数据）并留下版本记录，后续 V2+ 才有可预期基线。
  # 升级/加列/演练库对账从此有 flyway_schema_history 可查。
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true
  # ADR-0022：两处自动装配**恒排除**，客户端由 StoreConfig / EsConfig / QdrantConfig 显式构造
  # 并按 opspilot.storage.mode 装配。两个都排除，理由各一条：
  #   ① RedissonAutoConfigurationV2：它会在 memory 模式下照样建客户端并**急连** Redis，
  #      于是"零依赖模式"反过来依赖 Redis；显式构造还顺手把连接参数的出处从魔法约定变成可读代码。
  #   ② RedisAutoConfiguration（Lettuce 那套）：它按 spring.data.redis.* 建 RedisConnectionFactory，
  #      而 Boot 会据此注册 RedisHealthIndicator——**无条件 ping Redis**。memory 模式下
  #      /actuator/health 因此恒为 DOWN（实测咬到），而 demo.sh / liveness.py / compose healthcheck
  #      都以这个端点当存活判据，整条零依赖路径会被判"没起来"。本项目从不使用 RedisConnectionFactory
  #      （唯一消费者是 RedissonClient），排除它不损失任何能力。
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # P3：中间件凭据只从环境注入；空=无认证（CI/单测形态）

opspilot:
  storage:
    # live=真中间件（缺则启动失败，与历史行为一致）| memory=内存实现，零外部依赖（ADR-0022）。
    # **不自动回退**：探不到中间件只打印一条可执行的提示，然后照常失败——配置期事实不该
    # 跟着运行期抖动走（理由见 OpsPilotProperties.Storage 注释）。
    mode: ${STORAGE_MODE:live}
  # G0-W0.1 部署安全开关（DeploymentGuard 读取）。strict=true 是生产形态声明：
  # JWT 密钥强度、H2 口令、真实模型、live 存储、监听地址任一项不达标即启动失败并点名变量。
  # 默认 false 只为保持本机演示路径不回归——生产必须显式置 true。
  deploy:
    strict: ${OPSPILOT_STRICT:false}
    # 容器/反代形态才置 true：strict 下允许 SERVER_ADDRESS=0.0.0.0/::（裸机生产保持 false）
    allow-public-bind: ${OPSPILOT_ALLOW_PUBLIC_BIND:false}
  dashscope:
    base-url: https://dashscope.aliyuncs.com
    api-key: ${DASHSCOPE_API_KEY:}
    mode: ${DASHSCOPE_MODE:auto}   # auto=有Key走live否则mock | live | mock
    embedding-model: text-embedding-v3
    embedding-dim: 1024
    rerank-model: ${RERANK_MODEL:gte-rerank-v2}   # 旧 gte-rerank 已停授权(403)，v2 为同族直升，min-relevance 分数分布兼容
    llm-model: ${LLM_MODEL:qwen-plus}   # 可覆写：给"自动熔断"一个**可控的失败注入点**（填不存在的模型名 → 上游 4xx → 连续失败达阈 → L2），见 OPS §5.1 降级复核段
    llm-timeout-seconds: 60
    # B3（2026-09-21 补）：精排与 embedding 共用那个 RestClient 的 socket 兜底。
    # 必须比 retrieval.leg-timeout-ms（4500）松——同量级会赛跑，抛出的是原始 socket
    # 异常而不是走业务降级，降级状态机就收不到它该收的信号。
    connect-timeout-ms: ${DASHSCOPE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DASHSCOPE_READ_TIMEOUT_MS:15000}
  es:
    uri: http://${ES_HOST:localhost}:9200
    index: opspilot-chunks-read      # P4：查询侧只认别名（物理 opspilot-chunks-<ts>，reingest 原子换指）
    username: ${ES_USER:elastic}
    password: ${ES_PASSWORD:}        # P3：xpack security 开启后必填；空=本地无认证形态
    # B3（2026-09-21 补）：socket 兜底，不是 SLO——ES 挂住时不让检索线程无限等
    connect-timeout-ms: ${ES_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ES_READ_TIMEOUT_MS:10000}
  qdrant:
    host: ${QDRANT_HOST:localhost}
    grpc-port: 6334
    collection: opspilot-vectors-live   # P4：同上，别名指向 staging 换入的物理集合
    cache-collection: semantic-cache    # 运行时 L2 缓存（物理名，reingest 不清空）
    api-key: ${QDRANT_API_KEY:}      # P3：REST/gRPC 共用；空=无认证形态
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}   # P2：短时凭证 24h（吊销靠每请求查库，不靠短 TTL 兜底）
  # G1 准入（ADR-0026）：全局/租户两级并发上限；429 带 Retry-After，不排队。
  admission:
    global-permits: ${ADMISSION_GLOBAL_PERMITS:32}
    tenant-permits: ${ADMISSION_TENANT_PERMITS:4}
    retry-after-seconds: ${ADMISSION_RETRY_AFTER_SECONDS:1}
  cache:
    l1-ttl-hours: 2
    l2-threshold: 0.95
    # G1：L2 语义缓存的生命周期与容量上限（见 ADR / W1.3）。
    l2-ttl-hours: ${L2_TTL_HOURS:72}
    l2-max-entries: ${L2_MAX_ENTRIES:5000}
    # 过期清理节流：每小时扫一次；首启延迟 1 分钟，避开重灌/预热窗口。
    l2-cleanup-interval-ms: ${L2_CLEANUP_INTERVAL_MS:3600000}
    l2-cleanup-initial-delay-ms: ${L2_CLEANUP_INITIAL_DELAY_MS:60000}
  storm:
    window-seconds: 30
    alert-window-seconds: 60
  retrieval:
    es-top-k: 50
    qdrant-top-k: 50
    rrf-k: 60
    rerank-top-k: 20
    final-top-k: 3
    leg-timeout-ms: ${LEG_TIMEOUT_MS:4500}   # mock 时代 800ms；live 实测 DashScope embedding 2.2-3.7s，取观测 P99+检索余量
    min-relevance: ${MIN_RELEVANCE:0.2}   # Top-1 相关度低于此值→空态拒答（快路径豁免）
  degrade:
    inflight-threshold: 40
    llm-failure-threshold: 3
    llm-open-seconds: 60

logging:
  level:
    com.opspilot: INFO

# 健康面：/actuator/health 只输出聚合状态（含 redis/qdrant/es 组件的 UP/DOWN 判定，
# 明细走鉴权端点 /api/v1/admin/health——依赖异常摘要不能对未授权访客可见）
# 指标面（ADRs 0016）：暴露 /actuator/prometheus（Prometheus 文本格式，aiops.* 计数与比率）。
# 该端点不带凭证（鉴权过滤器只守 /api/v1/copilot|admin 与 /v1），由抓取侧的网络策略兜住——
# 多租户公网部署时应改为仅内网可达或加 scraper 凭证。
# `include` 是**覆盖**而非追加默认值：漏写 health 会让 /actuator/health 直接 404，而它是
# demo.sh 预检 / backup.sh / quickstart.sh / liveness.py 的存活判据（check_panel_contract.sh
# 第五层把这一条钉成 CI 红）。
management:
  health:
    # G1（2026-10-22）：db 组件由 HealthCheckConfig.dbHealthIndicator 接管（SELECT 1，失败摘要可读）；
    # 不关掉 Boot 的 dbHealthContributor 会与本 bean 映射同一个组件键，谁赢取决于注册顺序。
    db:
      enabled: false
    # ADR-0022 落地实测：Boot 的 ElasticsearchRestClientHealthIndicator 是**按 classpath**注册的
    # （不是按 RestClient bean），所以"memory 模式不建 ES 客户端"挡不住它——它照样 ping
    # localhost:9200 并把 /actuator/health 拖成 DOWN。
    # 关掉它**不损失任何能力**：本项目自己的 esHealthIndicator（HealthCheckConfig，组件键 es）
    # 做的是同一件事且更准（走别名、带 opspilot.es.* 的 socket 超时、能报 docs 计数），
    # 而 demo.sh / liveness.py / compose healthcheck 读的正是聚合状态。
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      # G1：分组属于 endpoint（不是 management.health）。liveness 不依赖外部资源；
      # readiness 含外部依赖 + 模型后端形态。probes.enabled=true 才会注册 livenessState/readinessState
      # 并暴露 /actuator/health/liveness|readiness（3.5.7 的自动装配对这两个状态没有 matchIfMissing）。
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,es,qdrant,backend
