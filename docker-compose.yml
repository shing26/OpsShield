# OpsPilot 本地中间件栈
# 内存预算：ES 768m + Qdrant 512m + Redis 320m ≈ 1.6GB（基础栈）；gateway 容器形态 +768m
# （历史：曾含 lobe-chat UI 形态 +2g，2026-09-11 撤除，/v1 协议面不依赖 UI 容器——ADR-0007 状态注）
# P3 生产基线：全部服务启用认证 + 端口仅绑定 127.0.0.1（防同机/局域网匿名直连绕权限）
# 凭据只从 .env 注入（compose 自动读同目录 .env）；缺失时 compose 启动即报错，不会静默裸奔
services:
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    # QA P3 排查（2026-09-11）：96mb 下风暴测试的窗口 ZSET+L1 载荷触发 allkeys-lru 淘汰，
    # L1 观测寿命 <3min 与配置 2h 矛盾即此。全部键均带 TTL、皆为可再生数据，扩容量而非换策略。
    # G1：allkeys-lru 会把"没有 TTL 的 SOP 兜底键"也当成淘汰候选；volatile-lru 只淘汰带 TTL 的键，
    # 避免 L2 期需要的静态 SOP 最先被内存压力清掉。所有写入键必须设 TTL（SOP/配额/锁定/缓存已设）。
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --save "" --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置（.env）}
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: opspilot-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY 未设置（.env）}
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    # qdrant 官方镜像无 curl/wget 可做 HTTP 探活（1.12.4 实测）；冷启动 1-2s，
    # 远快于 gateway JVM（>10s），gateway 侧以 service_started 依赖 + ES 健康门控即可
    restart: unless-stopped

  # 网关本体（可复现部署形态）：docker compose --profile full up -d --build
  # 默认不随基础栈启动——宿主裸进程模式与容器模式二选一，避免抢 8081
  gateway:
    profiles: ["full"]
    build: .
    container_name: opspilot-gateway
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    env_file: .env
    environment:
      SERVER_PORT: "8081"
      # 容器内必须监听所有接口（宿主机端口映射已限 127.0.0.1）；宿主裸进程形态由
      # scripts/start_gateway.sh 默认绑 127.0.0.1——两种形态的安全边界不能靠默认值碰运气。
      SERVER_ADDRESS: "0.0.0.0"
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      ES_HOST: elasticsearch
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # P1-3（QA 2026-09-11）：H2BackupPath 锁 <cwd>/backup，此前未映射 → 备份落容器可写层，
      # 随重建蒸发且 cron 假绿。账号库是唯一不可再生数据，必须落宿主卷。
      - ./backup:/app/backup
    mem_limit: 768m
    # G1：优雅停机预算要大于应用内 drain（30s）与 SSE 收尾，否则 SIGKILL 会截断审计尾行。
    stop_grace_period: 90s
    restart: unless-stopped
    # G1 容器面加固：根文件系统只读（可写路径只有 data/logs/backup 三个卷与 /tmp tmpfs），
    # 丢掉全部 capability 并禁止提权。镜像仍是 JRE 默认用户（非 root 迁移需先解决 bind mount UID）。
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: opspilot-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=true          # P3：开启原生认证（basic 免费档）
      - xpack.security.http.ssl.enabled=false # 内网单机不上 TLS（决策见 ADR-0005）
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=false
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD 未设置（.env）}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 告警侧（alerting profile）：真实 Prometheus 规则 → Alertmanager → 宿主 bridge。
  # 默认不启动——Prometheus+Alertmanager 约 400MB，不进基础栈的内存预算（≈1.6GB）。
  #
  # 抓取与投递目标都是**宿主**（网关与 bridge 都按本仓既定形态跑宿主裸进程），
  # 故两容器都必须显式声明 host.docker.internal：Linux 的 Docker 不默认提供该 DNS 名，
  # 缺了不会启动报错，只会静默抓不到/投递失败（表现为 target down 或通知丢失）。
  prometheus:
    profiles: ["alerting"]
    image: prom/prometheus:v2.55.1
    container_name: opspilot-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/alerting/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerting/rules:/etc/prometheus/rules:ro
      # G0：此前只挂配置，Docker Desktop 重启/重建即丢历史与静默状态——
      # "那 20 分钟有没有告警"复盘时无法回答。
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=30d
    healthcheck:
      # prom/prometheus 是 busybox 底，wget 可用。/-/ready 只在配置与规则文件都加载成功时回 200，
      # 规则语法写错会让它一直不 ready——这正是我们要的判据（否则表现为 target 面空白而容器"健康"）。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  alertmanager:
    profiles: ["alerting"]
    image: prom/alertmanager:v0.27.0
    container_name: opspilot-alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # G0：静默/通知状态必须跨容器重建存活，否则重启后告警会重新打扰一遍。
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 96m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant-data:
  es-data:
  prometheus-data:
  alertmanager-data:
